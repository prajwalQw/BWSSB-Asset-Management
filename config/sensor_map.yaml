# Sensor to IGNOAPI Telemetry Mapping Configuration
# Bengaluru Water Network Digital Twin (BWSSB)
# Adheres strictly to:
# 1. Verified scale factors (no guessed multipliers).
# 2. Strict read-only bridge polling.
# 3. Dynamic feed health tagging: LIVE, STALE, OUT_OF_BOUNDS, or SIMULATED_FALLBACK.
# 4. Clean per-sensor fallback to SIMULATED when variable is missing or unverified.
# 5. Dedicated asset "Pump control panel (auxiliary supply)" for true 12V DC and 2A telemetry.
# 6. Any new IGNOAPI variable added in future maps through this file only.

version: "1.1.0"
updated_at: "2026-10-21T17:58:00Z"

# Bridge Polling & Connection Settings
bridge_settings:
  host: "127.0.0.1"
  port: 8899
  poll_interval_seconds: 0.5
  staleness_threshold_seconds: 3.0
  allow_writes: false              # IMMUTABLE: Enforces Rule 4 read-only safety
  socket_timeout_seconds: 2.0
  reconnect_backoff_max_seconds: 10.0

# ─────────────────────────────────────────────────────────────────────────────
# 1. PUMP CONTROL PANEL (AUXILIARY SUPPLY) - LIVE SCADA TELEMETRY
# ─────────────────────────────────────────────────────────────────────────────
# Dedicated station electrical panel asset exposing true unscaled 12V DC and 2A telemetry.
auxiliary_panels:
  - panel_id: "PANEL_TG_AUX_01"
    name: "Pump control panel (auxiliary supply)"
    station_id: "PS_TATAGUNI_MAIN"
    station_name: "Tataguni Terminal Pumping Station"
    data_tier_default: "LIVE"
    provenance: "LIVE"
    coordinates: [77.5255, 12.8680]
    channels:
      aux_voltage:
        channel_id: "PANEL_TG_AUX_01_VOLTAGE"
        label: "Auxiliary Control DC Bus Voltage"
        ignoapi_variable: "voltage_v"
        unit: "V DC"
        scale_factor: 1.0
        offset: 0.0
        valid_range: {min: 9.0, max: 15.0}
        data_tier: "LIVE"
        fallback_source: "SIMULATED"
        verified: true
        notes: "Direct 1:1 telemetry of 12 V DC auxiliary control supply / battery backup."

      aux_current:
        channel_id: "PANEL_TG_AUX_01_CURRENT"
        label: "Auxiliary Pilot / Instrumentation Current"
        ignoapi_variable: "motor_current_a"
        unit: "A DC"
        scale_factor: 1.0
        offset: 0.0
        valid_range: {min: 0.0, max: 20.0}
        data_tier: "LIVE"
        fallback_source: "SIMULATED"
        verified: true
        notes: "Direct 1:1 telemetry of 2 A auxiliary drive and instrument power draw."

      shaft_speed:
        channel_id: "PANEL_TG_AUX_01_SPEED"
        label: "Pump Shaft Speed (Auxiliary Sensor)"
        ignoapi_variable: "speed"
        unit: "RPM"
        scale_factor: 1.0
        offset: 0.0
        valid_range: {min: 0.0, max: 1800.0}
        data_tier: "LIVE"
        fallback_source: "SIMULATED"
        verified: true
        notes: "Rotational speed in RPM."

      motor_temperature:
        channel_id: "PANEL_TG_AUX_01_TEMP"
        label: "Motor Casing Thermocouple"
        ignoapi_variable: "motor_temp_c"
        unit: "deg C"
        scale_factor: 1.0
        offset: 0.0
        valid_range: {min: 15.0, max: 120.0}
        data_tier: "LIVE"
        fallback_source: "SIMULATED"
        verified: true
        notes: "Motor stator thermocouple in deg C."

      drive_alarm_register:
        channel_id: "PANEL_TG_AUX_01_ALARM"
        label: "Drive Fault Alarm Register"
        ignoapi_variable: "alarmLM"
        unit: "code"
        scale_factor: 1.0
        offset: 0.0
        valid_range: {min: 0, max: 65535}
        data_tier: "LIVE"
        fallback_source: "SIMULATED"
        verified: true
        notes: "Drive fault code register."

