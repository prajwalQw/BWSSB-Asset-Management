# Level of Detail (LOD) and Map Engine Configuration
# Bengaluru Water Network Digital Twin (BWSSB)

version: "1.0.0"

# Bounding box covering BWSSB boundary + Tataguni + Harohalli + TK Halli + 10% padding
bounding_box:
  min_lon: 77.0300
  min_lat: 12.1570
  max_lon: 77.8700
  max_lat: 13.2730
  padding_percent: 10.0

# Zoom level thresholds for Level of Detail (LOD)
zoom_thresholds:
  supercluster_max_zoom: 11.0    # z < 11: cluster counts per division, no pipes < 600mm
  trunk_mains_min_zoom: 11.0     # z 11-13: stations, WTPs, STPs, GLRs, trunk mains only
  trunk_mains_max_zoom: 14.0
  all_mains_min_zoom: 14.0       # z 14-16: all mains, valves, meters inline on pipes at chainage
  all_mains_max_zoom: 17.0
  chevrons_min_zoom: 15.0        # z >= 15: direction chevrons on pipe midpoints
  site_plan_min_zoom: 17.0       # z >= 17: site-plan view with pump units, manifolds, meters, tags

# Pipe diameter classifications (mm)
pipe_classes:
  trunk:
    min_diameter_mm: 600
    casing_width_factor: 1.5
    core_width_factor: 1.0
  mains:
    min_diameter_mm: 300
    max_diameter_mm: 600
    casing_width_factor: 1.3
    core_width_factor: 0.8
  distribution:
    max_diameter_mm: 300
    casing_width_factor: 1.2
    core_width_factor: 0.6

# Flow animation settings
flow_animation:
  trail_length: 120.0
  fade_trail: true
  min_zoom: 11.0
  default_velocity_mps: 1.2
  chevron_interval_m: 90.0
  impeller_rotation_hz: 1.0      # 1 Hz impeller two-frame toggle

# Telemetry freshness and staleness
telemetry:
  stale_threshold_seconds: 3.0
  poll_interval_seconds: 0.5

# Navigation Shortcuts / Bookmarks
camera_shortcuts:
  city:
    name: "City View"
    description: "Greater Bengaluru Metropolitan Overview (z=11.2)"
    center: [77.5946, 12.9716]
    zoom: 11.2
    pitch: 30
    bearing: 0
  tataguni:
    name: "Tataguni Corridor"
    description: "South-Central Transmission Corridor (z=14.2)"
    center: [77.5300, 12.8750]
    zoom: 14.2
    pitch: 42
    bearing: -12
  jayanagar:
    name: "Jayanagar DMA"
    description: "Distribution Management Area & Local Mains (z=15.8)"
    center: [77.5750, 12.9350]
    zoom: 15.8
    pitch: 48
    bearing: -20
  tataguni_site:
    name: "Tataguni Site Plan"
    description: "Terminal Pumping Station Electromechanical Layout (z=17.5)"
    center: [77.5148, 12.8690]
    zoom: 17.5
    pitch: 50
    bearing: -22
  tkhalli_site:
    name: "TK Halli WTP Site"
    description: "Torekadanahalli Water Treatment Works (z=17.5)"
    center: [77.1650, 12.3150]
    zoom: 17.5
    pitch: 45
    bearing: -15

# Site-Plan layout specifications for high-zoom engineering views (z >= 17)
site_plans:
  PS_TATAGUNI_TERMINAL:
    station_id: "PS_TATAGUNI_TERMINAL"
    name: "Tataguni Terminal Pumping Station"
    origin: [77.5148, 12.8690]
    footprint:
      width_m: 60.0
      length_m: 35.0
      rotation_deg: 35.0
      is_simulated: true
    suction_header:
      offset_start_m: [-20.0, -8.0]
      offset_end_m: [20.0, -8.0]
      diameter_mm: 1200
    discharge_header:
      offset_start_m: [-20.0, 12.0]
      offset_end_m: [20.0, 12.0]
      diameter_mm: 1000
    pump_units:
      - id: "P1"
        tag: "P1 1200 kW"
        offset_m: [-12.0, 2.0]
        rotation_deg: 90.0
        rated_kw: 1200
        rated_current_a: 124.5
        rated_voltage_v: 6600
        suction_valve_offset_m: [-12.0, -4.0]
        discharge_valve_offset_m: [-12.0, 7.0]
      - id: "P2"
        tag: "P2 1200 kW"
        offset_m: [0.0, 2.0]
        rotation_deg: 90.0
        rated_kw: 1200
        rated_current_a: 124.5
        rated_voltage_v: 6600
        suction_valve_offset_m: [0.0, -4.0]
        discharge_valve_offset_m: [0.0, 7.0]
      - id: "P3"
        tag: "P3 1200 kW (Standby)"
        offset_m: [12.0, 2.0]
        rotation_deg: 90.0
        rated_kw: 1200
        rated_current_a: 124.5
        rated_voltage_v: 6600
        suction_valve_offset_m: [12.0, -4.0]
        discharge_valve_offset_m: [12.0, 7.0]
    instrumentation:
      flow_meter:
        id: "FM-03"
        tag: "FM-03 42.1 L/s"
        offset_m: [24.0, 12.0]
      pressure_transmitter:
        id: "PT-01"
        tag: "PT-01 6.8 bar"
        offset_m: [-22.0, 12.0]
